<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#232F3E" />
            <stop offset="100%" stop-color="#0D1117" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
        </filter>
        <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <rect width="800" height="420" fill="url(#bg)" />

    <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.05">
        <line x1="0" y1="70" x2="800" y2="70" />
        <line x1="0" y1="140" x2="800" y2="140" />
        <line x1="0" y1="210" x2="800" y2="210" />
        <line x1="0" y1="280" x2="800" y2="280" />
        <line x1="0" y1="350" x2="800" y2="350" />
        <line x1="133" y1="0" x2="133" y2="420" />
        <line x1="266" y1="0" x2="266" y2="420" />
        <line x1="400" y1="0" x2="400" y2="420" />
        <line x1="533" y1="0" x2="533" y2="420" />
        <line x1="666" y1="0" x2="666" y2="420" />
    </g>

    <g fill="#FF9900" opacity="0.6" transform="translate(-100, -50) scale(0.8)">
        <path d="M 900 120 Q 920 80 960 90 Q 990 70 1020 110 Q 1060 110 1050 150 Q 1070 190 1030 200 Q 1000 230 960 210 Q 920 230 890 200 Q 860 190 870 150 Q 860 110 900 120 Z" />
    </g>

    <text x="400" y="110" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="1">BUILDING AN END-TO-END</text>
    <text x="400" y="160" fill="#FF9900" font-family="sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1">CI/CD PIPELINE ON AWS</text>

    <g transform="translate(40, 260) scale(0.8)">
        <rect x="0" y="0" width="200" height="100" rx="15" fill="#24292e" stroke="#ffffff" stroke-width="1" filter="url(#shadow)"/>
        <text x="100" y="45" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Source</text>
        <text x="100" y="70" fill="#8b949e" font-family="sans-serif" font-size="16" text-anchor="middle">GitHub</text>

        <!-- Arrow 1 -->
        <g transform="translate(210, 35)" filter="url(#glow1)">
            <path d="M 0 10 L 90 10 L 90 -5 L 130 15 L 90 35 L 90 20 L 0 20 Z" fill="#3b82f6" opacity="0.9" />
        </g>

        <rect x="350" y="0" width="200" height="100" rx="15" fill="#005276" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="450" y="45" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Build</text>
        <text x="450" y="70" fill="#60a5fa" font-family="sans-serif" font-size="16" text-anchor="middle">AWS CodeBuild</text>

        <!-- Arrow 2 -->
        <g transform="translate(560, 35)" filter="url(#glow1)">
            <path d="M 0 10 L 90 10 L 90 -5 L 130 15 L 90 35 L 90 20 L 0 20 Z" fill="#10b981" opacity="0.9" />
        </g>

        <rect x="700" y="0" width="200" height="100" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
        <text x="800" y="45" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Deploy</text>
        <text x="800" y="70" fill="#34d399" font-family="sans-serif" font-size="16" text-anchor="middle">AWS CodeDeploy</text>
    </g>
</svg>